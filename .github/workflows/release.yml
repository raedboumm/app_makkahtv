name: Release

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - name: Write env.json
        run: printf '{"YOUTUBE_API_KEY":"%s","YOUTUBE_ANDROID_CERT":"%s"}' '${{ secrets.YOUTUBE_API_KEY }}' '${{ secrets.YOUTUBE_ANDROID_CERT }}' > env.json

      - name: Decode keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks

      - name: Write key.properties
        run: |
          printf '%s\n' \
            'storePassword=${{ secrets.KEYSTORE_PASSWORD }}' \
            'keyPassword=${{ secrets.KEY_PASSWORD }}' \
            'keyAlias=${{ secrets.KEY_ALIAS }}' \
            'storeFile=../upload-keystore.jks' \
            > android/key.properties

      - name: Patch flutter_inappwebview for AGP 9.x
        run: |
          find ~/.pub-cache -path "*/flutter_inappwebview_android*/build.gradle" \
            -exec sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' {} +

      - run: flutter build appbundle --dart-define-from-file=env.json

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.md.makkatv
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - name: Write env.json
        run: printf '{"YOUTUBE_API_KEY":"%s","YOUTUBE_ANDROID_CERT":"%s"}' '${{ secrets.YOUTUBE_API_KEY }}' '${{ secrets.YOUTUBE_ANDROID_CERT }}' > env.json

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Register CI device for provisioning
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 << 'PYEOF'
          import json, time, base64, subprocess, urllib.request, os

          key_id = os.environ["API_KEY_ID"]
          issuer_id = os.environ["API_ISSUER_ID"]
          key_path = os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")

          def b64url(data):
              if isinstance(data, str): data = data.encode()
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          header = json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"})
          now = int(time.time())
          payload = json.dumps({"iss":issuer_id,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"})
          msg = f"{b64url(header)}.{b64url(payload)}"

          der = subprocess.run(
              ["openssl","dgst","-sha256","-sign",key_path],
              input=msg.encode(), capture_output=True
          ).stdout

          # DER ECDSA -> raw R||S for ES256
          i = 2
          r_len = der[i+1]; r = der[i+2:i+2+r_len]; i += 2+r_len
          s_len = der[i+1]; s = der[i+2:i+2+s_len]
          raw = r[-32:].rjust(32, b"\x00") + s[-32:].rjust(32, b"\x00")
          jwt_token = f"{msg}.{b64url(raw)}"

          body = json.dumps({"data":{"type":"devices","attributes":{
              "name":"CI Runner","platform":"IOS",
              "udid":"00008101-000000000000001E"
          }}}).encode()

          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/devices",
              data=body,
              headers={"Authorization":f"Bearer {jwt_token}","Content-Type":"application/json"}
          )
          try:
              urllib.request.urlopen(req)
              print("Device registered")
          except urllib.error.HTTPError as e:
              err = e.read().decode()
              if e.code == 409 or "DUPLICATE" in err:
                  print("Device already registered")
              else:
                  print(f"Device registration: {e.code} (non-fatal)")
                  print(err[:300])
          PYEOF

      - name: Build iOS (no codesign)
        run: flutter build ipa --dart-define-from-file=env.json --no-codesign

      - name: Archive and export with API key
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            CODE_SIGN_STYLE="Automatic" \
            DEVELOPMENT_TEAM="5PH7734WT7" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release.ipa
          path: build/ios/ipa/*.ipa
